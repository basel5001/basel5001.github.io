name: PR Size Labeler

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: basel5001/githubinfra/.github/workflows/pr-size-labeler.yml@main