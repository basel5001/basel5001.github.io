name: Renovate
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renovate Bot
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: renovate.json